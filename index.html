<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOS MMXIII | Catálogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Barra de navegación superior (Estilo App) -->
    <header>
        <div class="logo">HOS MMXIII</div>
        <div class="cart-icon">🛒</div>
    </header>

    <!-- CONTENEDOR PRINCIPAL DE PRODUCTOS -->
    <main class="main-container">
        
        <!-- PRODUCTO 1: HUSTLE BLACK (Se muestra por defecto) -->
        <section id="producto-1" class="product-section active">
            <div class="product-image-wrapper">
                <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80" alt="Playera 1">
                <!-- Flechas de navegación -->
                <button class="nav-arrow prev" onclick="cambiarProducto('atras')">❮</button>
                <button class="nav-arrow next" onclick="cambiarProducto('adelante')">❯</button>
            </div>
            <div class="product-details">
                <h1>HUSTLE OVERSIZE - BLACK</h1>
                <div class="price">$550 MXN</div>
                <p>Algodón premium, corte urbano.</p>
                
                <div class="selector-group">
                    <label>Talla:</label>
                    <select id="talla-1">
                        <option value="S">Chica (S)</option>
                        <option value="M">Mediana (M)</option>
                        <option value="L">Grande (L)</option>
                    </select>
                </div>
                <a href="#" class="btn-whatsapp" onclick="enviarPedido(1)">PEDIR POR WHATSAPP</a>
            </div>
        </section>

        <!-- PRODUCTO 2: GRAFFITI WHITE (Oculto inicialmente) -->
        <section id="producto-2" class="product-section next">
            <div class="product-image-wrapper">
                <!-- Cambia esta URL por tu segunda foto -->
                <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?q=80" alt="Playera 2">
                <button class="nav-arrow prev" onclick="cambiarProducto('atras')">❮</button>
                <button class="nav-arrow next" onclick="cambiarProducto('adelante')">❯</button>
            </div>
            <div class="product-details">
                <h1>GRAFFITI MTY - WHITE</h1>
                <div class="price">$580 MXN</div>
                <p>Edición limitada centro MTY.</p>
                
                <div class="selector-group">
                    <label>Talla:</label>
                    <select id="talla-2">
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                    </select>
                </div>
                <a href="#" class="btn-whatsapp" onclick="enviarPedido(2)">PEDIR POR WHATSAPP</a>
            </div>
        </section>

        <!-- PRODUCTO 3: OLD ENGLISH BLUE (Oculto inicialmente) -->
        <section id="producto-3" class="product-section next">
            <div class="product-image-wrapper">
                <!-- Cambia esta URL por tu tercer foto -->
                <img src="https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?q=80" alt="Playera 3">
                <button class="nav-arrow prev" onclick="cambiarProducto('atras')">❮</button>
                <button class="nav-arrow next" onclick="cambiarProducto('adelante')">❯</button>
            </div>
            <div class="product-details">
                <h1>OLD ENGLISH - BLUE</h1>
                <div class="price">$600 MXN</div>
                <p>Estilo gánster urbano.</p>
                
                <div class="selector-group">
                    <label>Talla:</label>
                    <select id="talla-3">
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                    </select>
                </div>
                <a href="#" class="btn-whatsapp" onclick="enviarPedido(3)">PEDIR POR WHATSAPP</a>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
